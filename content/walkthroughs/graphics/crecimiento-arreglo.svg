<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 235">
  <title>Crecimiento de un arreglo dinámico</title>
  <desc>El arreglo traslada sus valores de un bloque de dos celdas a otro de cuatro antes de agregar el 30.</desc>
  <g data-part="origen">
    <text data-style="caption" x="20" y="24" font-size="19">Bloque original</text>
    <rect data-style="surface" x="20" y="37" width="68" height="42" rx="8"/>
    <rect data-style="surface" x="96" y="37" width="68" height="42" rx="8"/>
    <text data-style="label" x="54" y="64" text-anchor="middle" font-size="20">10</text>
    <text data-style="label" x="130" y="64" text-anchor="middle" font-size="20">20</text>
  </g>
  <g data-part="flecha-copia" data-hidden="true">
    <path data-style="connector" d="M165 57Q245 58 245 141" stroke-width="2.5"/>
    <polygon data-style="arrowhead" points="239,137 251,137 245,147"/>
    <text data-style="caption" x="254" y="98" font-size="19">Copiar</text>
  </g>
  <g data-part="destino" data-hidden="true">
    <text data-style="caption" x="122" y="166" font-size="19">Bloque nuevo</text>
    <rect data-style="surface" x="122" y="180" width="68" height="42" rx="8"/>
    <rect data-style="surface" x="198" y="180" width="68" height="42" rx="8"/>
    <rect data-style="surface" x="274" y="180" width="68" height="42" rx="8"/>
    <rect data-style="surface" x="350" y="180" width="68" height="42" rx="8"/>
  </g>
  <g data-part="copiados" data-hidden="true">
    <text data-style="label" x="156" y="207" text-anchor="middle" font-size="20">10</text>
    <text data-style="label" x="232" y="207" text-anchor="middle" font-size="20">20</text>
  </g>
  <text data-part="agregado" data-hidden="true" data-style="label" x="308" y="207" text-anchor="middle" font-size="20">30</text>
</svg>
